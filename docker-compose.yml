services:
  postgres:
    image: postgres:16-alpine
    container_name: social-analytics-postgres
    environment:
      POSTGRES_DB: social_analytics
      POSTGRES_USER: social_analytics
      POSTGRES_PASSWORD: social_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_analytics -d social_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
