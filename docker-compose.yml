x-airflow-common: &airflow-common
  image: apache/airflow:3.2.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres/${AIRFLOW_POSTGRES_DB}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres/${AIRFLOW_POSTGRES_DB}
    AIRFLOW__CELERY__BROKER_URL: redis://:@airflow-redis:6379/${AIRFLOW_REDIS_DB}
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME}
    AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
    SOCIAL_ANALYTICS_AIRFLOW_LOAD_TARGET: ${SOCIAL_ANALYTICS_AIRFLOW_LOAD_TARGET}
    SOCIAL_ANALYTICS_POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
    YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID}
    YOUTUBE_CHANNEL_HANDLE: ${YOUTUBE_CHANNEL_HANDLE}
    YOUTUBE_LOCAL_LOAD_TARGET: ${YOUTUBE_LOCAL_LOAD_TARGET}
    YOUTUBE_MAX_PAGES: ${YOUTUBE_MAX_PAGES}
    YOUTUBE_SMOKE_LOOKBACK_DAYS: ${YOUTUBE_SMOKE_LOOKBACK_DAYS}
    _PIP_ADDITIONAL_REQUIREMENTS: "psycopg[binary]>=3.2,<4"
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./src:/opt/airflow/project/src:ro
    - ./data:/opt/airflow/project/data
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    airflow-redis:
      condition: service_healthy
    airflow-postgres:
      condition: service_healthy

services:
  dashboard:
    build:
      context: .
    container_name: social-analytics-dashboard
    command: /bin/sh -c "serve-dashboard --host 0.0.0.0 --port 8000 --output \"$${DASHBOARD_OUTPUT}\" $${DASHBOARD_NO_SMOKE}"
    environment:
      PYTHONUNBUFFERED: "1"
      DASHBOARD_OUTPUT: ${DASHBOARD_OUTPUT:-data/dashboard/smoke.html}
    ports:
      - "${DASHBOARD_PORT}:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import os, urllib.request;
          from urllib.parse import quote;
          output = os.environ.get("DASHBOARD_OUTPUT", "data/dashboard/smoke.html");
          request = urllib.request.Request(
          f"http://localhost:8000/{quote(output.lstrip('/'))}", method="HEAD"
          );
          urllib.request.urlopen(request, timeout=2).close()
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: social-analytics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  airflow-postgres:
    image: postgres:16-alpine
    container_name: social-analytics-airflow-postgres
    environment:
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-redis:
    image: redis:7.2-bookworm
    container_name: social-analytics-airflow-redis
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: social-analytics-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "$AIRFLOW_ADMIN_USERNAME" \
          --password "$AIRFLOW_ADMIN_PASSWORD" \
          --firstname "$AIRFLOW_ADMIN_FIRSTNAME" \
          --lastname "$AIRFLOW_ADMIN_LASTNAME" \
          --role Admin \
          --email "$AIRFLOW_ADMIN_EMAIL" \
        || airflow users reset-password \
          --username "$AIRFLOW_ADMIN_USERNAME" \
          --password "$AIRFLOW_ADMIN_PASSWORD"
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    container_name: social-analytics-airflow-api-server
    command: api-server
    ports:
      - "${AIRFLOW_API_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: social-analytics-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    container_name: social-analytics-airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-worker:
    <<: *airflow-common
    container_name: social-analytics-airflow-worker
    command: celery worker
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-triggerer:
    <<: *airflow-common
    container_name: social-analytics-airflow-triggerer
    command: triggerer
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

volumes:
  postgres-data:
  airflow-postgres-data:
