[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "social-analytics-pipeline"
version = "0.1.0"
description = "Pipeline de analytics social com extracao, normalizacao e orquestracao de metricas."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Caio Braga" }
]
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3"
]

[project.scripts]
dashboard-smoke = "social_analytics_pipeline.cli.dashboard_smoke:cli_entrypoint"
instagram-local-pipeline = "social_analytics_pipeline.cli.instagram_local_pipeline:cli_entrypoint"
instagram-report = "social_analytics_pipeline.cli.instagram_report:cli_entrypoint"
serve-dashboard = "social_analytics_pipeline.cli.serve_dashboard:cli_entrypoint"
social-dashboard = "social_analytics_pipeline.cli.dashboard:cli_entrypoint"
youtube-report = "social_analytics_pipeline.cli.youtube_report:cli_entrypoint"

[project.optional-dependencies]
dev = [
    "bandit[toml]==1.7.10",
    "pip-audit==2.7.3",
    "ruff==0.8.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-dir = "tests"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B608"]
