title = "Social Analytics Pipeline Gitleaks Config"

[extend]
useDefault = true

[[allowlists]]
description = "Local-only Docker Compose development credentials"
paths = [
  '''docker-compose\.yml''',
  '''docs/BOOTSTRAP\.md'''
]
